<body>
<div class="wrap" id="app"></div>
<script>
var BADGES={SALE:'Discounted',HOT:'Hot',FAST:'Selling fast',BEST:'Best seller',LIMITED:'Limited offer',NEW:'New'};
var DEF={contact:"",banner:{text:"",style:"white"},services:[
{id:"s1",cat:"Instagram",name:"Instagram Views",qty:1000,price:0.5},
{id:"s2",cat:"Instagram",name:"Instagram Likes",qty:1000,price:1.2},
{id:"s3",cat:"Instagram",name:"Instagram Followers",qty:1000,price:3},
{id:"s4",cat:"YouTube",name:"YouTube Views",qty:1000,price:2},
{id:"s5",cat:"Facebook",name:"Facebook Post Likes",qty:1000,price:1.5},
{id:"s6",cat:"Facebook",name:"Facebook Followers",qty:1000,price:2.5},
{id:"s7",cat:"Facebook",name:"Facebook Page Likes",qty:1000,price:2.5},
{id:"s8",cat:"TikTok",name:"TikTok Views",qty:1000,price:0.4},
{id:"s9",cat:"TikTok",name:"TikTok Followers",qty:1000,price:3.5}]};
var data=clone(DEF),draft=null,filter="all",db=null,docRef=null,canEdit=false,ready=false,loaded=false,loadErr=false,dirty=false,view="home",status="";
var app=document.getElementById("app");
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function money(n){return "US$"+Number(n).toFixed(2)}
function num(n){return Number(n).toLocaleString("en-US")}
function route(){if(view==="refund"||location.hash==="#/refund")return"refund";return view==="admin"||location.hash==="#/admin"?"admin":"home"}
function cats(list){var c=[];list.forEach(function(s){if(s.cat&&c.indexOf(s.cat)<0)c.push(s.cat)});return c}
function bannerHtml(){var b=data.banner;return b&&b.text&&route()!=="admin"?'<div class="bnr bn-'+esc(b.style||'white')+'">'+esc(b.text)+'</div>':''}
function nav(){return bannerHtml()+'<nav><a class="logo" id="lg" href="#/">ACLLC<span>SOCIAL BOOST</span></a>'+(route()==="admin"?'<a class="al" id="al" href="#/">VIEW SITE</a>':'')+'</nav>'}
function wire(){
var lg=document.getElementById("lg"),n=0,t;
if(lg)lg.onclick=function(e){e.preventDefault();if(route()!=="home"){view="home";location.hash="#/";draft=null;render();window.scrollTo(0,0);return}n++;clearTimeout(t);t=setTimeout(function(){n=0},900);if(n>=3){n=0;view="admin";render()}};
var rf=document.getElementById("rf");if(rf)rf.onclick=function(e){e.preventDefault();view="refund";render();window.scrollTo(0,0)};
var al=document.getElementById("al");
if(al)al.onclick=function(e){e.preventDefault();view=route()==="admin"?"home":"admin";if(view==="home")location.hash="#/";draft=null;render()}}
function home(){
var cs=cats(data.services);if(filter!=="all"&&cs.indexOf(filter)<0)filter="all";
var h=nav()+'<div class="note">Live prices — not final, packages and prices may change throughout the day</div><div class="hero"><small>Social Media Services</small><h1>Grow your reach.<br><b>Transparent pricing.</b></h1></div><div class="chips">';
["all"].concat(cs).forEach(function(c){h+='<button class="chip'+(filter===c?' on':'')+'" data-f="'+esc(c)+'">'+(c==="all"?"All":esc(c))+'</button>'});
h+='</div>';
cs.forEach(function(c){
if(filter!=="all"&&filter!==c)return;
h+='<h2>'+esc(c)+'</h2>';
data.services.filter(function(s){return s.cat===c}).forEach(function(s){
var off=s.old>s.price?Math.round((1-s.price/s.old)*100):0;
var gone=s.until&&s.until<=Date.now();
h+='<div class="row'+(gone?' ended':'')+'"><div><div class="n">'+esc(s.name)+(BADGES[s.badge]?'<span class="bd bd-'+s.badge+'">'+BADGES[s.badge]+'</span>':'')+'</div>'+(s.info?'<div class="inf">'+esc(s.info)+'</div>':'')+(s.until?'<div class="tm" data-u="'+s.until+'"></div>':'')+'</div><div class="r"><div class="pr"><small>QUANTITY</small><b>'+num(s.qty)+'</b></div><div class="pr"><small>PRICE</small>'+(off?'<s class="was">'+money(s.old)+'</s> <span class="off">-'+off+'%</span><br>':'')+'<b'+(off?' class="dc"':'')+'>'+money(s.price)+'</b></div>'+
(data.contact&&!gone?'<a class="btn" target="_blank" rel="noopener" href="'+esc(data.contact)+'">Order</a>':'')+'</div></div>'});
});
h+='<footer><span class="fb">ACLLC SOCIAL BOOST</span><span class="fc">All payments are secured by Stripe</span><span class="fr"><a href="https://www.instagram.com/achdouzcompany/" target="_blank" rel="noopener">Instagram</a><a href="#/refund" id="rf">Refund Policy</a></span></footer><div class="cr">&copy; ACLLC 2026 — All rights reserved</div>';
app.innerHTML=h;
wire();app.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){filter=b.dataset.f;render()}});
}
function dt(ms){if(!ms)return'';var d=new Date(ms),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function badgeOpts(v){var o='<option value="">No tag</option>';for(var k in BADGES)o+='<option value="'+k+'"'+(k===v?' selected':'')+'>'+BADGES[k]+'</option>';return o}
function admin(){
var h=nav()+'<div class="adm"><h1>Admin</h1>';
if(!ready){app.innerHTML=h+'<p>Loading...</p></div>';wire();return}
if(!canEdit){app.innerHTML=h+'<p>Sign in to manage services.</p><div class="fld" style="flex-direction:column;align-items:flex-start;gap:12px"><input class="w" id="em" type="email" placeholder="Email" autocomplete="username"><input class="w" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn s" id="li">Sign in</button><span class="st" id="st"></span></div></div>';wire();
var go=function(){if(!window.fbLogin){setSt("Firebase did not load. Check your connection and try again.");return}setSt("Signing in...");fbLogin(document.getElementById("em").value.trim(),document.getElementById("pw").value).catch(function(){setSt("Wrong email or password.")})};
document.getElementById("li").onclick=go;document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")go()};return}
if(loadErr){app.innerHTML=h+'<div class="box">Could not load your saved data from Firebase, so editing is disabled to avoid overwriting it. Check your connection and the Firestore rules, then reload.</div></div>';wire();return}
if(!loaded){app.innerHTML=h+'<p>Loading your saved data...</p></div>';wire();return}
if(!draft){draft=clone(data);dirty=false}if(!draft.banner)draft.banner={text:'',style:'white'};
h+='<p>Edit name, quantity and price, add or remove services, then press Save. The landing page updates in real time.</p>';
cats(draft.services).forEach(function(c){
h+='<h2>'+esc(c)+'</h2>';
draft.services.forEach(function(s,i){if(s.cat!==c)return;
h+='<div class="row"><div class="fld"><input class="t" data-i="'+i+'" data-k="name" value="'+esc(s.name)+'"></div><div class="fld"><label>QTY</label><input type="number" min="1" step="1" data-i="'+i+'" data-k="qty" value="'+s.qty+'"><label>US$</label><input type="number" min="0" step="0.01" data-i="'+i+'" data-k="price" value="'+s.price+'"><label>WAS</label><input type="number" min="0" step="0.01" data-i="'+i+'" data-k="old" value="'+(s.old||'')+'"><label>ENDS</label><input type="datetime-local" data-i="'+i+'" data-k="until" value="'+dt(s.until)+'" style="width:210px;text-align:left"><select data-i="'+i+'" data-k="badge">'+badgeOpts(s.badge)+'</select><input class="inp" data-i="'+i+'" data-k="info" maxlength="200" placeholder="Package info shown on the page (optional)" value="'+esc(s.info||'')+'"><button class="btn x" data-del="'+i+'">Delete</button></div></div>'});
h+='<div class="add"><button class="btn" data-add="'+esc(c)+'">Add service to '+esc(c)+'</button></div>'});
h+='<h2>New platform</h2><div class="row"><div class="fld"><input class="t" id="np" placeholder="Platform name, e.g. Twitter"><button class="btn" id="npb">Add platform</button></div></div>';
h+='<h2>Top banner</h2><div class="row"><div class="fld"><input class="t" id="bn" maxlength="160" placeholder="Banner text (empty hides it)" style="width:340px;max-width:100%" value="'+esc(draft.banner.text||'')+'"><select id="bs">'+['white','red','green','amber','blue'].map(function(c){return '<option value="'+c+'"'+(draft.banner.style===c?' selected':'')+'>'+c.charAt(0).toUpperCase()+c.slice(1)+'</option>'}).join('')+'</select></div></div>';
h+='<h2>Order button link</h2><div class="row"><input class="w" id="contact" placeholder="https://wa.me/... or mailto:... (empty hides button)" value="'+esc(draft.contact||"")+'"></div>';
h+='<div class="bar"><button class="btn s" id="save">Save changes</button><button class="btn" id="reset">Reset to defaults</button><button class="btn" id="so">Sign out</button><span class="st" id="st">'+status+'</span></div></div>';
app.innerHTML=h;wire();
app.querySelectorAll("input[data-k],select[data-k]").forEach(function(el){el.oninput=el.onchange=function(){
var s=draft.services[el.dataset.i],k=el.dataset.k;
s[k]=(k==="name"||k==="badge"||k==="info")?el.value:k==="until"?(el.value?new Date(el.value).getTime():0):(parseFloat(el.value)||0)}});
app.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){dirty=true;draft.services.splice(+b.dataset.del,1);admin()}});
app.querySelectorAll("[data-add]").forEach(function(b){b.onclick=function(){dirty=true;draft.services.push({id:"s"+Date.now(),cat:b.dataset.add,name:"New service",qty:1000,price:1});admin()}});
document.getElementById("npb").onclick=function(){var v=document.getElementById("np").value.trim();if(!v)return;dirty=true;draft.services.push({id:"s"+Date.now(),cat:v,name:"New service",qty:1000,price:1});admin()};
document.getElementById("bn").oninput=function(e){draft.banner.text=e.target.value};document.getElementById("bs").onchange=function(e){draft.banner.style=e.target.value};
document.getElementById("contact").oninput=function(e){draft.contact=e.target.value.trim()};
document.getElementById("save").onclick=function(){write(clone(draft))};
document.getElementById("reset").onclick=function(){draft=clone(DEF);write(clone(DEF));admin()};
document.getElementById("so").onclick=function(){fbLogout()};
}
function write(o){
o.services=o.services.filter(function(s){return s.name&&s.cat}).map(function(s){return{id:s.id,info:String(s.info||"").trim().slice(0,200),cat:s.cat,name:s.name,qty:Math.max(1,Math.round(s.qty)||1000),price:Math.max(0,Math.round(s.price*100)/100||0),old:Math.max(0,Math.round((s.old||0)*100)/100),badge:BADGES[s.badge]?s.badge:"",until:Math.max(0,Math.round(s.until||0))}});
var bb=o.banner||{};o.banner={text:String(bb.text||'').trim().slice(0,160),style:['white','red','green','amber','blue'].indexOf(bb.style)>=0?bb.style:'white'};
setSt("Saving...");
fbSet(o).then(function(){data=o;dirty=false;setSt("Saved. Live on the landing page.")}).catch(function(e){setSt("Save failed: "+(e&&e.message||"error"))});
}
function setSt(t){status=t;var e=document.getElementById("st");if(e)e.textContent=t}
function refund(){
var h=nav()+'<div class="pol"><small>LEGAL</small><h1>Refund Policy</h1>'+
'<h3>No Refunds</h3><p><b>All sales are final. ACLLC does not offer refunds once an order has been sent.</b> By placing an order and submitting payment, you agree to this policy.</p>'+
'<h3>Profile Information</h3><p>Every customer must send the exact information for their profile, page or post, including the correct username or link. Make sure the account is public and the details are spelled correctly before you place the order.</p>'+
'<p>Any error in the information you send, such as a wrong, misspelled or changed username or link, or a private account, is the customer\'s responsibility. We do not issue refunds for orders delivered to the information provided.</p>'+
'<h3>After the Order Is Sent</h3><p>Once an order has been sent, it cannot be cancelled, changed or refunded under any circumstances.</p>'+
'<h3>Pricing</h3><p>All package prices are not final. Prices change over time throughout the day. The price shown when you place your order is the price you pay.</p>'+
'<h3>Payments</h3><p>All payments are processed through Stripe, a trusted payment gateway. ACLLC does not store or have access to your full card details.</p>'+
'<a class="btn" id="bk" href="#/">Back to services</a></div>'+
'<footer><span class="fb">ACLLC SOCIAL BOOST</span><span class="fc">All payments are secured by Stripe</span><span class="fr"><a href="https://www.instagram.com/achdouzcompany/" target="_blank" rel="noopener">Instagram</a></span></footer><div class="cr">&copy; ACLLC 2026 — All rights reserved</div>';
app.innerHTML=h;wire();
document.getElementById("bk").onclick=function(e){e.preventDefault();view="home";location.hash="#/";render();window.scrollTo(0,0)};
}
function tick(){document.querySelectorAll(".tm").forEach(function(el){
var left=Math.floor((+el.dataset.u-Date.now())/1000);
if(left<=0){if(!el.dataset.done){el.dataset.done=1;el.textContent="Offer ended";el.className="tm t-end";var r=el.closest(".row");if(r){r.classList.add("ended");var b=r.querySelector("a.btn");if(b)b.remove()}}return}
var d=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60),x=left%60,p=function(n){return String(n).padStart(2,"0")};
el.textContent="Ends in "+(d?d+"d ":"")+p(h)+":"+p(m)+":"+p(x);
